name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulasi publish (dry-run, tidak menulis ke registry npm)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Dibutuhkan untuk npm Trusted Publishing (OIDC) + provenance.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bun run typecheck
      - run: bun test --workspaces

  publish:
    name: Build & publish ke npm
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org
          node-version: 22
      # Trusted Publishing (OIDC) butuh npm >= 11.5.1 (ARCHITECTURE.md §10).
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      # Core dibangun lebih dulu supaya provider/hono tidak race dengan d.ts core.
      - run: bun run --filter @bayar-sdk/core build
      - run: bun run build

      - name: Publish packages
        run: |
          ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="--dry-run"
          fi
          bash .github/scripts/publish-packages.sh $ARGS
